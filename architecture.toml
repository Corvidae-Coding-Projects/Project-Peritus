schema = 3
soft_source_lines = 400
hard_source_lines = 700
root_module_lines = 80
required_license = "MIT"
ignored_directories = [
    ".git",
    ".crosslink",
    ".worktrees",
    "reference-repos",
    "target",
    "target-verus",
]
forbidden_module_names = ["common", "helpers", "manager", "misc", "utils"]
trusted_source_roots = ["crates/foundation/peritus-tcb/src"]
source_exceptions = [
    { path = "crates/app/peritus-cli/src/args.rs", owner = "G1", rationale = "The strict dependency-free CLI parser keeps the complete closed command grammar, option cardinality, and stable usage failures in one auditable surface while command value types live separately." },
    { path = "crates/app/peritus-tui/src/model/interaction.rs", owner = "G2", rationale = "The deterministic TUI interaction reducer keeps navigation, prompt, terminal, and cancellation action-to-effect transitions in one exhaustive state-machine surface." },
    { path = "crates/app/peritus-tui/src/model.rs", owner = "G2", rationale = "The bounded presentation state keeps view, notice, prompt, event, terminal, and pending-request invariants together while protocol and interaction transitions remain split into submodules." },
    { path = "crates/app/peritus-tui/src/render.rs", owner = "G2", rationale = "The complete terminal view renderer keeps shared layout and the closed runs, diff, review, trace, evolution, approval, terminal, and help views visually consistent." },
    { path = "crates/extensions/peritus-mcp/src/server.rs", owner = "G3", rationale = "The MCP server keeps its closed JSON-RPC lifecycle, request dispatch, cancellation registry, bounded pagination, and response mapping in one auditable protocol surface." },
    { path = "crates/extensions/peritus-plugin-host/src/host.rs", owner = "G3", rationale = "The plugin host keeps discovery-to-start-to-authorize-to-invoke-to-stop lifecycle ordering and owned runtime state in one auditable orchestration surface." },
    { path = "crates/extensions/peritus-plugin-sdk/src/manifest.rs", owner = "G3", rationale = "The canonical plugin manifest keeps the versioned entrypoint, capability, quota, signature, trust, validation, and digest contract together for compatibility review." },
    { path = "crates/analysis/peritus-eval/src/aggregate/reducer.rs", owner = "E3", rationale = "The pure evaluation reducer keeps its closed command vocabulary, legal phase transitions, and corresponding canonical command encoding in one auditable surface." },
    { path = "crates/analysis/peritus-eval/src/aggregate/state.rs", owner = "E3", rationale = "Complete evaluation state and its versioned canonical encode/decode implementation remain together so replay digest correspondence can be audited directly." },
    { path = "crates/analysis/peritus-eval/src/aggregate/types.rs", owner = "E3", rationale = "The closed durable aggregate vocabulary keeps phase, rollout, plan, publication, report, and failure tag mappings visible together." },
    { path = "crates/analysis/peritus-eval/src/durability/commit.rs", owner = "E3", rationale = "Evaluation commit logic keeps journal append, artifact dependency admission, outbox insertion, claim acknowledgement, and checkpoint ordering in one transaction audit surface." },
    { path = "crates/analysis/peritus-eval/src/durability/directive.rs", owner = "E3", rationale = "The three closed evaluation outbox directive families keep canonical codecs, deterministic identities, and claimed-message validation together." },
    { path = "crates/analysis/peritus-eval/src/profile/binding.rs", owner = "E3", rationale = "Frozen profile construction keeps every dataset, harness, provider, execution, retry, metric, infrastructure, and limit binding beside its domain-separated digest." },
    { path = "crates/analysis/peritus-eval/src/report/analysis.rs", owner = "E3", rationale = "Evaluation analysis keeps correctness denominators, paired evidence, resource aggregation, missing-data policy, and reliability accounting in one checked derivation." },
    { path = "crates/analysis/peritus-eval/src/verified.rs", owner = "E3", rationale = "The E3 Verus refinement surface keeps executable predicates adjacent to their specifications and proofs so runtime-to-proof correspondence remains inspectable." },
    { path = "crates/orchestration/peritus-agent/src/canonical/event_wire.rs", owner = "D0", rationale = "The closed version-one command payload codec keeps its exhaustive encode/decode tag correspondence in one audited source." },
    { path = "crates/orchestration/peritus-agent/src/reducer.rs", owner = "D0", rationale = "The pure reducer keeps the complete closed command vocabulary and legal phase transitions visible in one exhaustive audit surface." },
    { path = "crates/orchestration/peritus-agent/src/runtime/driver.rs", owner = "D0", rationale = "The cooperative driver core keeps commit-before-state and commit-before-provider-ack ordering together; C4 tool steps are already split out." },
    { path = "crates/orchestration/peritus-agent/src/runtime/tools.rs", owner = "D0", rationale = "The C4 coordinator keeps proposal-order slot state and the sole prepare, dispatch, control, recovery, and result projection boundary together." },
    { path = "crates/orchestration/peritus-agent/tests/runtime_driver.rs", owner = "D0", rationale = "The fake-provider durability matrix shares one exact scripted-provider and request fixture across completion, duplicate, malformed-order, and restart cases." },
    { path = "crates/orchestration/peritus-agent/tests/runtime_tools.rs", owner = "D0", rationale = "The end-to-end D0/C4 test intentionally shows complete B0/B1/C0 authority and lease assembly beside inspect, edit, run, and test effect ordering." },
    { path = "crates/orchestration/peritus-context/tests/compaction_matrix.rs", owner = "C6", rationale = "The compaction matrix keeps source validation and operational graph-replacement cases beside their shared canonical graph fixture." },
    { path = "crates/orchestration/peritus-review/tests/domain_engine.rs", owner = "D2", rationale = "The D2 engine matrix keeps exact binding, quorum, waiver, terminal, and shared identity fixtures together so each assertion exercises the same deterministic domain construction." },
    { path = "crates/orchestration/peritus-review/tests/domain_transitions.rs", owner = "D2", rationale = "The D2 transition matrix keeps reconciliation, confirmation, cancellation, supersession, and oscillation sequences beside one shared canonical review-history fixture." },
    { path = "crates/state/peritus-migrations/src/engine.rs", owner = "C0", rationale = "The migration engine keeps backup, transaction, integrity, recovery, and version publication ordering in one auditable implementation." },
    { path = "crates/state/peritus-migrations/src/registry.rs", owner = "C0", rationale = "The ordered migration registry keeps every historical descriptor and the exact validated schema chain visible in one compatibility audit surface." },
    { path = "crates/state/peritus-migrations/tests/fixture_upgrade.rs", owner = "C0", rationale = "The historical migration matrix keeps v1, v3, and unversioned byte-preservation fixtures with their shared journal hash and row-snapshot machinery." },
]
forbidden_dependencies = []
controlled_source_roots = [
    { path = "app-protocol/generated", owner = "A3", kind = "generated-schema", rationale = "A3 deterministically generates the reviewed application-protocol JSON Schema, TypeScript declarations, and wire registry." },
    { path = "compat/app-protocol", owner = "A3", kind = "generated", rationale = "A3 owns minimal, realistic, corrupt, and adversarial application-protocol compatibility fixtures with per-case SHA-256 inventories." },
    { path = "crates/analysis/peritus-debugger/tests/fixtures/v1", owner = "E2", kind = "generated", rationale = "E2 owns immutable schema-versioned debugger command, event, and complete-state compatibility frames plus their SHA-256 manifest." },
    { path = "crates/analysis/peritus-eval/tests/fixtures/v1", owner = "E3", kind = "generated", rationale = "E3 owns immutable schema-versioned evaluation command, event, and complete-state compatibility frames plus their SHA-256 manifest." },
    { path = "crates/analysis/peritus-evolution/tests/fixtures/v1", owner = "F0", kind = "generated", rationale = "F0 owns immutable schema-versioned campaign and production-pointer command, event, and complete-state compatibility frames plus their SHA-256 manifest." },
    { path = "crates/app/peritus-app-protocol/src/schema", owner = "A3", kind = "schema", rationale = "A3 owns the handwritten application family, variant, error, and field metadata plus deterministic renderers and fixture constructors." },
    { path = "crates/foundation/peritus-protocol/src/schema", owner = "B3", kind = "schema", rationale = "B3 owns the handwritten family registry, deterministic renderers, fixture constructors, and code-generation implementation." },
    { path = "crates/orchestration/peritus-collaboration/tests/fixtures/v1", owner = "D3", kind = "generated", rationale = "D3 owns immutable schema-versioned collaboration command, event, and complete-state compatibility frames plus their SHA-256 manifest." },
    { path = "crates/orchestration/peritus-harness/tests/fixtures/v1", owner = "E1", kind = "generated", rationale = "E1 owns immutable schema-versioned harness command, event, and complete-state compatibility frames plus their SHA-256 manifest." },
    { path = "crates/orchestration/peritus-orchestrator/tests/fixtures/v1", owner = "E0", kind = "generated", rationale = "E0 owns immutable schema-versioned orchestrator command, event, and complete-state compatibility frames plus their SHA-256 manifest." },
    { path = "crates/orchestration/peritus-review/tests/fixtures", owner = "D2", kind = "generated", rationale = "D2 owns immutable schema-versioned command, event, and complete-state compatibility frames plus their SHA-256 manifest." },
    { path = "crates/tools/peritus-tool-protocol/src/schema.rs", owner = "C4", kind = "schema", rationale = "C4 owns the bounded tool schema model, builders, canonical encoding, validation, and compatibility contract." },
    { path = "crates/tools/peritus-tool-protocol/src/schema", owner = "C4", kind = "schema", rationale = "C4 owns the reviewed tool schema canonicalization, validation, duplicate detection, and compatibility implementation." },
    { path = "crates/model/peritus-model-protocol/src/schema.rs", owner = "C5", kind = "schema", rationale = "C5 owns the provider-facing bounded JSON Schema representation and canonical validation contract." },
    { path = "crates/model/peritus-provider-openai/src/runtime/request/schema.rs", owner = "C5", kind = "schema", rationale = "C5 owns the constrained Codex runtime result schema that represents inert host tool proposals without granting executable authority." },
    { path = "crates/model/peritus-model-protocol/fixtures/v1", owner = "C5", kind = "generated", rationale = "C5 owns immutable version-one model-protocol compatibility fixtures and their digest inventory." },
    { path = "crates/state/peritus-artifact-store/src/catalog/schema.rs", owner = "C0", kind = "schema", rationale = "C0 owns the artifact catalog schema used by the shared durable SQLite database." },
    { path = "crates/state/peritus-evidence/src/sqlite/schema.rs", owner = "C0", kind = "schema", rationale = "C0 owns the durable evidence catalog schema and its provenance constraints." },
    { path = "crates/state/peritus-journal/src/sqlite/schema.rs", owner = "C0", kind = "schema", rationale = "C0 owns the authoritative journal schema and transactional state tables." },
    { path = "crates/state/peritus-migrations/fixtures", owner = "C0", kind = "generated", rationale = "C0 owns immutable old-schema fixtures exercised by forward migration and restoration tests." },
    { path = "crates/state/peritus-projection/src/sqlite/schema.rs", owner = "C0", kind = "schema", rationale = "C0 owns versioned projection generations and atomic activation metadata." },
    { path = "fixtures/protocol/scheduler-v1", owner = "D3", kind = "generated", rationale = "D3 owns immutable schema-versioned scheduler command, event, and complete-state compatibility frames plus their SHA-256 manifest." },
    { path = "protocol/generated", owner = "B3", kind = "generated-schema", rationale = "B3 deterministically generates the reviewed protocol schema and TypeScript client declarations." },
    { path = "protocol/fixtures/v1", owner = "B3", kind = "generated", rationale = "B3 deterministically generates the immutable version-one binary compatibility corpus and digest inventory." },
]


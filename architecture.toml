introduced_by = "B1"
future_owner = "B0"
statement = "V-only kernel logic binds current lifecycle/policy/revision/action facts, exact producing-attempt and review-participant sets, and the exact current credential-registry revision, and produces the logical PolicyActivationTransition and next-state plan from V-owned candidate facts without importing H approval or C0 types."


[[refinement_reservations]]
id = "REF-B0-B1-CURRENT-STATE-WITNESS"
introduced_by = "B1"
future_owner = "B0"
statement = "V-only kernel logic binds current lifecycle/policy/revision/action facts, exact producing-attempt and review-participant sets, and the exact current credential-registry revision, and produces the logical PolicyActivationTransition and next-state plan from V-owned candidate facts without importing H approval or C0 types."

[[refinement_reservations]]
id = "REF-E0-B1-COMMIT-BEFORE-EFFECT"
introduced_by = "B1"
future_owner = "E0"
statement = "E0 assembles matching capability use, durable budget charge/reservation, lease use when mutating, approval plus its exact credential-registry revision when required, B0 current-state witness, and exact C0 commit/current-registry receipts before invoking a target authorization gateway; it does not construct that target's permit."

[[refinement_reservations]]
id = "REF-E0-B1-POLICY-ACTIVATION"
introduced_by = "B1"
future_owner = "E0"
statement = "E0 matches candidate, H-owned approved amendment, B0 witness, and first C0 approval receipt; submits B0's unchanged V-only activation plan for a distinct linked C0 commit; then installs/replays only B0's exact next state after the second receipt."

[[refinement_reservations]]
id = "REF-B2-B1-CONTRACT-REVISION"
introduced_by = "B1"
future_owner = "B2"
statement = "Acceptance-contract validation binds every authority request to one exact RevisionTuple."

[[refinement_reservations]]
id = "REF-B0-B2-CURRENT-EVIDENCE"
introduced_by = "B2"
future_owner = "B0"
statement = "The lifecycle kernel evaluates acceptance only from its exact current contract, RevisionTuple, and V-owned current-evidence projection; raw B2 observation values or an AcceptanceDecision are logical facts and do not independently authorize a lifecycle transition."

[[refinement_reservations]]
id = "REF-D1-B2-GATE-OBSERVATION"
introduced_by = "B2"
future_owner = "D1"
statement = "Gate observations correspond to actual executions of the frozen GateDefinition against the exact clean candidate snapshot, environment, parser, success rule, artifacts, and dependency order declared by the contract."

[[refinement_reservations]]
id = "REF-D2-B2-REVIEW-OBSERVATION"
introduced_by = "B2"
future_owner = "D2"
statement = "Review, finding, and waiver observations correspond to authenticated fresh-context read-only review records and preserve reviewer identity, category coverage, disposition, authority, and exact-revision provenance."

[[refinement_reservations]]
id = "REF-B0-B1-REVISION-FRESHNESS"
introduced_by = "B1"
future_owner = "B0"
statement = "Kernel lifecycle checks reject B1 transitions whose exact RevisionTuple is not current."

[[refinement_reservations]]
id = "REF-B0-B1-BUDGET-CEILING"
introduced_by = "B1"
future_owner = "B0"
statement = "Kernel integration proves root limit is within the B2 effective policy ceiling and child limit is within parent availability."

[[refinement_reservations]]
id = "REF-G0-B1-STARTUP-FENCING"
introduced_by = "B1"
future_owner = "G0"
statement = "Restart advances the durable epoch, fences/reconciles every active lease, invalidates prior capability/approval time state, and blocks mutation intake until complete."

[[refinement_reservations]]
id = "REF-E0-B0-CURRENT-LIFECYCLE"
introduced_by = "B0"
future_owner = "E0"
statement = "Orchestration requests effects only for the exact current run, attempt, turn, and action recorded by B0 and only after C0 commits the matching B0 transition and returns its non-forgeable receipt."

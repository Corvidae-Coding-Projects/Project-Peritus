[workspace]
members = [
    "crates/app/testing/peritus-conformance",
    "crates/app/testing/peritus-test-support",
    "crates/foundation/peritus-budget",
    "crates/foundation/peritus-codec",
    "crates/foundation/peritus-kernel",
    "crates/foundation/peritus-policy",
    "crates/foundation/peritus-protocol",
    "crates/foundation/peritus-quality-policy",
    "crates/foundation/peritus-spec",
    "crates/foundation/peritus-tcb",
    "crates/foundation/peritus-types",
    "crates/state/peritus-approval",
    "crates/state/peritus-artifact-store",
    "crates/state/peritus-evidence",
    "crates/state/peritus-journal",
    "crates/state/peritus-leases",
    "crates/state/peritus-migrations",
    "crates/state/peritus-projection",
    "crates/runtime/peritus-git",
    "crates/runtime/peritus-network",
    "crates/runtime/peritus-patch",
    "crates/runtime/peritus-process",
    "crates/runtime/peritus-sandbox",
    "crates/runtime/peritus-sandbox-linux",
    "crates/runtime/peritus-sandbox-macos",
    "crates/runtime/peritus-sandbox-windows",
    "crates/runtime/peritus-secrets",
    "crates/runtime/peritus-workspace",
    "crates/model/peritus-model-protocol",
    "crates/model/peritus-provider-core",
    "crates/model/peritus-provider-openai",
    "crates/model/peritus-provider-anthropic",
    "crates/model/peritus-provider-google",
    "crates/model/peritus-provider-compatible",
    "crates/orchestration/peritus-collaboration",
    "crates/orchestration/peritus-context",
    "crates/orchestration/peritus-agent",
    "crates/orchestration/peritus-gates",
    "crates/orchestration/peritus-memory",
    "crates/orchestration/peritus-orchestrator",
    "crates/orchestration/peritus-review",
    "crates/orchestration/peritus-role",
    "crates/orchestration/peritus-scheduler",
    "crates/observe/peritus-trace",
    "crates/observe/peritus-telemetry",
    "crates/tools/peritus-tool-protocol",
    "crates/tools/peritus-tool-router",
    "crates/tools/peritus-tools-fs",
    "crates/tools/peritus-tools-git",
    "crates/tools/peritus-tools-quality",
    "crates/tools/peritus-tools-shell",
    "xtask",
]
default-members = ["xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/Corvidae-Coding-Projects/Project-Peritus"

[workspace.dependencies]
base64 = "=0.22.1"
bytes = "=1.12.1"
ed25519-dalek = { version = "=3.0.0", default-features = false }
fs4 = "=1.1.0"
futures-core = "=0.3.34"
futures-util = "=0.3.34"
keyring = { version = "=4.1.6", default-features = false }
landlock = { version = "=0.4.7", default-features = false }
libc = "=0.2.189"
nix = { version = "=0.31.3", default-features = false, features = ["signal", "term"] }
portable-pty = { version = "=0.9.0", default-features = false }
process-wrap = { version = "=9.1.0", default-features = false, features = ["creation-flags", "job-object", "process-group", "process-session", "std"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["http2", "rustls", "stream"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = { version = "=0.11.0", default-features = false }
seccompiler = { version = "=0.5.0", default-features = false }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
toml = "=1.1.4"
url = "=2.5.8"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
windows-sys = { version = "=0.61.2", default-features = false }
vstd = { version = "=0.0.0-2026-08-09-0044", git = "https://github.com/verus-lang/verus.git", rev = "92f466f247f45128c630d1c843fd6e27d2115587" }
yaml-rust2 = { version = "=0.12.0", default-features = false }

[workspace.metadata.peritus]
architecture-policy = "architecture.toml"
rust-toolchain = "1.97.1"
verus-version = "0.2026.08.09.92f466f"
vstd-revision = "92f466f247f45128c630d1c843fd6e27d2115587"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "deny", check-cfg = [
    "cfg(verus_keep_ghost)",
    "cfg(verus_keep_ghost_body)",
    "cfg(verus_only)",
    "cfg(verus_verify_core)",
] }
unsafe_code = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.dev]
incremental = false
overflow-checks = true

[profile.test]
incremental = false
overflow-checks = true

[profile.release]
codegen-units = 1
incremental = false
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"

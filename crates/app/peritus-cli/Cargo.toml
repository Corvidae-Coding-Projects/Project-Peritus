[package]
name = "peritus-cli"
description = "Scriptable command-line client for the Peritus daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
keywords = ["agents", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]

[features]
system-package = ["peritus-launcher/system-package"]

[dependencies]
peritus-tools-computer = { version = "=0.1.6", path = "../../tools/peritus-tools-computer" }
peritus-workspace = { version = "=0.1.6", path = "../../runtime/peritus-workspace" }
peritus-trace = { version = "=0.1.6", path = "../../observe/peritus-trace" }
peritus-modules = { version = "=0.1.6", path = "../../orchestration/peritus-modules" }
peritus-tools-web = { version = "=0.1.6", path = "../../tools/peritus-tools-web" }
base64.workspace = true
peritus-app-client = { version = "=0.1.6", path = "../peritus-app-client" }
peritus-app-protocol = { version = "=0.1.6", path = "../peritus-app-protocol" }
peritus-codec = { version = "=0.1.6", path = "../../foundation/peritus-codec" }
peritus-launcher = { version = "=0.1.6", path = "../peritus-launcher" }
peritus-model-protocol = { version = "=0.1.6", path = "../../model/peritus-model-protocol" }
peritus-run-settlement = { version = "=0.1.6", path = "../../orchestration/peritus-run-settlement" }
peritus-tools-shell = { version = "=0.1.6", path = "../../tools/peritus-tools-shell" }
peritus-types = { version = "=0.1.6", path = "../../foundation/peritus-types" }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[bin]]
name = "peritus"
path = "src/main.rs"

[package.metadata.peritus]
owner = "G1"
layer = "app"

[lints]
workspace = true

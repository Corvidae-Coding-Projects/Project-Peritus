[package]
name = "peritus-tui"
description = "Interactive terminal client for the Peritus daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
keywords = ["agents", "terminal", "tui", "client"]
categories = ["command-line-utilities"]

[dependencies]
peritus-modules = { version = "=0.1.13", path = "../../orchestration/peritus-modules" }
serde_json.workspace = true
base64.workspace = true
crossterm = { workspace = true, features = ["osc52"] }
peritus-app-protocol = { version = "=0.1.13", path = "../peritus-app-protocol" }
peritus-codec = { version = "=0.1.13", path = "../../foundation/peritus-codec" }
peritus-protocol = { version = "=0.1.13", path = "../../foundation/peritus-protocol" }
peritus-product-state = { version = "=0.1.13", path = "../peritus-product-state" }
peritus-workspace = { version = "=0.1.13", path = "../../runtime/peritus-workspace" }
peritus-run-settlement = { version = "=0.1.13", path = "../../orchestration/peritus-run-settlement" }
peritus-tools-shell = { version = "=0.1.13", path = "../../tools/peritus-tools-shell" }
peritus-types = { version = "=0.1.13", path = "../../foundation/peritus-types" }
ratatui.workspace = true
regex = "=1.13.1"
tui-markdown.workspace = true
pulldown-cmark = { version = "=0.13.4", default-features = false }
sha2.workspace = true
shell-words = "=1.1.1"
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
vt100.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { workspace = true, features = ["user"] }
signal-hook.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_Console"] }

[[bin]]
name = "peritus-tui"
path = "src/main.rs"

[package.metadata.peritus]
owner = "G2"
layer = "app"

[lints]
workspace = true

[package]
name = "peritus-resilience-qualification"
description = "Native H1 release-candidate qualification operator and effect controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["resilience", "qualification", "release", "recovery"]
categories = ["development-tools::testing"]

[dependencies]
peritus-approval = { version = "=0.0.0", path = "../../../state/peritus-approval" }
peritus-resilience = { version = "=0.0.0", path = "../peritus-resilience" }
peritus-types = { version = "=0.0.0", path = "../../../foundation/peritus-types" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
peritus-obligations = { version = "=0.0.0", path = "../../../orchestration/peritus-obligations" }
peritus-run-settlement = { version = "=0.0.0", path = "../../../orchestration/peritus-run-settlement" }
peritus-spec = { version = "=0.0.0", path = "../../../foundation/peritus-spec" }

[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[[bin]]
name = "peritus-h1"
path = "src/bin/peritus-h1.rs"

[[bin]]
name = "peritus-h1-controller"
path = "src/bin/peritus-h1-controller.rs"

[package.metadata.peritus]
owner = "H1"
layer = "testing"
verification-class = "C"

[lints]
workspace = true

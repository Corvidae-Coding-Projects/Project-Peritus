[package]
name = "peritus-external-benchmarks"
description = "Native HarnessBench and Terminal-Bench qualification boundary for Peritus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["agents", "benchmark", "qualification"]
categories = ["development-tools::testing"]

[dependencies]
base64.workspace = true
peritus-model-protocol = { version = "=0.1.16", path = "../../../model/peritus-model-protocol" }
peritus-daemon = { version = "=0.1.16", path = "../../peritus-daemon" }
peritus-launcher = { version = "=0.1.16", path = "../../peritus-launcher" }
peritus-product-runner = { version = "=0.1.16", path = "../../peritus-product-runner" }
peritus-process = { version = "=0.1.16", path = "../../../runtime/peritus-process" }
peritus-provider-anthropic = { version = "=0.1.16", path = "../../../model/peritus-provider-anthropic" }
peritus-provider-core = { version = "=0.1.16", path = "../../../model/peritus-provider-core" }
peritus-provider-openai = { version = "=0.1.16", path = "../../../model/peritus-provider-openai" }
peritus-run-settlement = { version = "=0.1.16", path = "../../../orchestration/peritus-run-settlement" }
peritus-types = { version = "=0.1.16", path = "../../../foundation/peritus-types" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[[bin]]
name = "peritus-benchmark-agent"
path = "src/bin/peritus-benchmark-agent.rs"

[[bin]]
name = "peritus-terminalbench-report"
path = "src/bin/peritus-terminalbench-report.rs"

[[bin]]
name = "peritus-harnessbench-report"
path = "src/bin/peritus-harnessbench-report.rs"

[package.metadata.peritus]
owner = "H3"
layer = "testing"

[lints]
workspace = true

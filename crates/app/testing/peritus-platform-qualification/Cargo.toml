[package]
name = "peritus-platform-qualification"
description = "H2 packaged-host qualification contracts and fresh-subject runner for Peritus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["packaging", "qualification", "cross-platform", "release"]
categories = ["development-tools::testing"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[package.metadata.peritus]
owner = "H2"
layer = "testing"
verification-class = "C"

[lints]
workspace = true

[[bin]]
name = "peritus-package"
path = "src/bin/peritus-package.rs"

[[bin]]
name = "peritus-h2"
path = "src/bin/peritus-h2.rs"

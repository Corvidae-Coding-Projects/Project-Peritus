[package]
name = "peritus-platform-qualification"
description = "H2 packaged-host qualification contracts and fresh-subject runner for Peritus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["packaging", "qualification", "cross-platform", "release"]
categories = ["development-tools::testing"]

[dependencies]
peritus-approval = { version = "=0.0.0", path = "../../../state/peritus-approval" }
peritus-types = { version = "=0.0.0", path = "../../../foundation/peritus-types" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
peritus-sandbox-linux = { version = "=0.0.0", path = "../../../runtime/peritus-sandbox-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
peritus-sandbox-macos = { version = "=0.0.0", path = "../../../runtime/peritus-sandbox-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
peritus-sandbox-windows = { version = "=0.0.0", path = "../../../runtime/peritus-sandbox-windows" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[package.metadata.peritus]
owner = "H2"
layer = "testing"
verification-class = "C"

[lints]
workspace = true

[[bin]]
name = "peritus-package"
path = "src/bin/peritus-package.rs"

[[bin]]
name = "peritus-h2"
path = "src/bin/peritus-h2.rs"

[[bin]]
name = "peritus-h2-controller"
path = "src/bin/peritus-h2-controller.rs"

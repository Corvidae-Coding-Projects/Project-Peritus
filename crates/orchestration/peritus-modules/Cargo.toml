[package]
name = "peritus-modules"
description = "Host-owned bundled and installable agent workflow modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
fs4.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
flate2.workspace = true
peritus-network = { version = "=0.1.14", path = "../../runtime/peritus-network" }
peritus-plugin-sdk = { version = "=0.1.14", path = "../../foundation/peritus-plugin-sdk" }
tar.workspace = true
url.workspace = true

[package.metadata.peritus]
owner = "E1"
layer = "orchestration"

[lints]
workspace = true

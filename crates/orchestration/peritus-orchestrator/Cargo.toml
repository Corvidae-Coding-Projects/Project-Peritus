[package]
name = "peritus-orchestrator"
description = "Durable deterministic writer, gate, reviewer, fixer, and acceptance orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"

[dependencies]
peritus-agent = { version = "=0.0.0", path = "../peritus-agent" }
peritus-codec = { version = "=0.0.0", path = "../../foundation/peritus-codec" }
peritus-collaboration = { version = "=0.0.0", path = "../peritus-collaboration" }
peritus-gates = { version = "=0.0.0", path = "../peritus-gates" }
peritus-journal = { version = "=0.0.0", path = "../../state/peritus-journal" }
peritus-kernel = { version = "=0.0.0", path = "../../foundation/peritus-kernel" }
peritus-policy = { version = "=0.0.0", path = "../../foundation/peritus-policy" }
peritus-quality-policy = { version = "=0.0.0", path = "../../foundation/peritus-quality-policy" }
peritus-review = { version = "=0.0.0", path = "../peritus-review" }
peritus-role = { version = "=0.0.0", path = "../peritus-role" }
peritus-scheduler = { version = "=0.0.0", path = "../peritus-scheduler" }
peritus-spec = { version = "=0.0.0", path = "../../foundation/peritus-spec" }
peritus-types = { version = "=0.0.0", path = "../../foundation/peritus-types" }
sha2.workspace = true
vstd.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[package.metadata.peritus]
owner = "E0"
layer = "orchestration"
verification-class = "H"

[package.metadata.verus]
verify = true

[lints]
workspace = true

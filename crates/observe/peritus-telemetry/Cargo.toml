[package]
name = "peritus-telemetry"
description = "Bounded OpenTelemetry-compatible projections and exporters for Peritus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["telemetry", "opentelemetry", "metrics", "formal-verification"]
categories = ["development-tools::profiling", "data-structures"]

[dependencies]
peritus-codec = { version = "=0.1.20", path = "../../foundation/peritus-codec" }
peritus-trace = { version = "=0.1.20", path = "../peritus-trace" }
peritus-types = { version = "=0.1.20", path = "../../foundation/peritus-types" }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std", "bit-set", "handle-panics"] }
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.peritus]
owner = "C7"
layer = "observe"


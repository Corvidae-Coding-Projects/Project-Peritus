[package]
name = "peritus-trace"
description = "Durable causal tracing and redaction boundary for Peritus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["tracing", "telemetry", "event-sourcing", "formal-verification"]
categories = ["development-tools::debugging", "data-structures"]

[dependencies]
peritus-artifact-store = { version = "=0.0.0", path = "../../state/peritus-artifact-store" }
peritus-codec = { version = "=0.0.0", path = "../../foundation/peritus-codec" }
peritus-journal = { version = "=0.0.0", path = "../../state/peritus-journal" }
peritus-projection = { version = "=0.0.0", path = "../../state/peritus-projection" }
peritus-types = { version = "=0.0.0", path = "../../foundation/peritus-types" }
vstd.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.peritus]
owner = "C7"
layer = "observe"
verification-class = "H"

[package.metadata.verus]
verify = true

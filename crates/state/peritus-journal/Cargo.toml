[package]
name = "peritus-journal"
description = "Transactional durable event journal and commit receipts for Peritus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["journal", "sqlite", "event-sourcing", "formal-verification"]
categories = ["database", "data-structures"]

[dependencies]
peritus-approval = { version = "=0.0.0", path = "../peritus-approval" }
peritus-artifact-store = { version = "=0.0.0", path = "../peritus-artifact-store" }
peritus-budget = { version = "=0.0.0", path = "../../foundation/peritus-budget" }
peritus-codec = { version = "=0.0.0", path = "../../foundation/peritus-codec" }
peritus-kernel = { version = "=0.0.0", path = "../../foundation/peritus-kernel" }
peritus-leases = { version = "=0.0.0", path = "../peritus-leases" }
peritus-policy = { version = "=0.0.0", path = "../../foundation/peritus-policy" }
peritus-protocol = { version = "=0.0.0", path = "../../foundation/peritus-protocol" }
peritus-types = { version = "=0.0.0", path = "../../foundation/peritus-types" }
rusqlite = { workspace = true, features = ["limits"] }
sha2.workspace = true
vstd.workspace = true

[dev-dependencies]
peritus-conformance = { version = "=0.0.0", path = "../../app/testing/peritus-conformance" }
peritus-test-support = { version = "=0.0.0", path = "../../app/testing/peritus-test-support" }
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.peritus]
owner = "C0"
layer = "state"
verification-class = "H"

[package.metadata.verus]
verify = true

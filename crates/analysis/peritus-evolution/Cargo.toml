peritus-debugger = { version = "=0.0.0", path = "../peritus-debugger" }
peritus-eval = { version = "=0.0.0", path = "../peritus-eval" }
peritus-evidence = { version = "=0.0.0", path = "../../state/peritus-evidence" }
peritus-harness = { version = "=0.0.0", path = "../../orchestration/peritus-harness" }
peritus-journal = { version = "=0.0.0", path = "../../state/peritus-journal" }
peritus-kernel = { version = "=0.0.0", path = "../../foundation/peritus-kernel" }
peritus-policy = { version = "=0.0.0", path = "../../foundation/peritus-policy" }
peritus-review = { version = "=0.0.0", path = "../../orchestration/peritus-review" }

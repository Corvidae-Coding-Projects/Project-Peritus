[package]
name = "peritus-evolution"
description = "Evidence-backed production harness evolution and promotion policy for Peritus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = false
keywords = ["evolution", "agents", "evaluation", "formal-verification"]
categories = ["development-tools::testing"]

[features]
default = []
qualification = ["dep:ed25519-dalek"]

[dependencies]
ed25519-dalek = { workspace = true, optional = true }
peritus-approval = { version = "=0.0.5", path = "../../state/peritus-approval" }
peritus-artifact-store = { version = "=0.0.5", path = "../../state/peritus-artifact-store" }
peritus-codec = { version = "=0.0.5", path = "../../foundation/peritus-codec" }
peritus-debugger = { version = "=0.0.5", path = "../peritus-debugger" }
peritus-eval = { version = "=0.0.5", path = "../peritus-eval" }
peritus-evidence = { version = "=0.0.5", path = "../../state/peritus-evidence" }
peritus-harness = { version = "=0.0.5", path = "../../orchestration/peritus-harness" }
peritus-journal = { version = "=0.0.5", path = "../../state/peritus-journal" }
peritus-kernel = { version = "=0.0.5", path = "../../foundation/peritus-kernel" }
peritus-policy = { version = "=0.0.5", path = "../../foundation/peritus-policy" }
peritus-review = { version = "=0.0.5", path = "../../orchestration/peritus-review" }
peritus-types = { version = "=0.0.5", path = "../../foundation/peritus-types" }

[lints]
workspace = true

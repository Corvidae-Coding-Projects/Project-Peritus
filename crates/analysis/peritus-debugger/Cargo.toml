[package]
name = "peritus-debugger"
description = "Durable evidence-linked trace diagnosis and harness analysis for Peritus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["debugging", "diagnostics", "agents", "formal-verification"]
categories = ["development-tools::debugging"]

[dependencies]
peritus-eval = { version = "=0.1.12", path = "../peritus-eval" }
peritus-agent = { version = "=0.1.12", path = "../../orchestration/peritus-agent" }
peritus-artifact-store = { version = "=0.1.12", path = "../../state/peritus-artifact-store" }
peritus-codec = { version = "=0.1.12", path = "../../foundation/peritus-codec" }
peritus-context = { version = "=0.1.12", path = "../../orchestration/peritus-context" }
peritus-evidence = { version = "=0.1.12", path = "../../state/peritus-evidence" }
peritus-harness = { version = "=0.1.12", path = "../../orchestration/peritus-harness" }
peritus-journal = { version = "=0.1.12", path = "../../state/peritus-journal" }
peritus-model-protocol = { version = "=0.1.12", path = "../../model/peritus-model-protocol" }
peritus-orchestrator = { version = "=0.1.12", path = "../../orchestration/peritus-orchestrator" }
peritus-provider-core = { version = "=0.1.12", path = "../../model/peritus-provider-core" }
peritus-trace = { version = "=0.1.12", path = "../../observe/peritus-trace" }
peritus-types = { version = "=0.1.12", path = "../../foundation/peritus-types" }

[package]
name = "peritus-eval"
description = "Durable reproducible harness evaluation and statistical evidence for Peritus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["evaluation", "agents", "statistics", "formal-verification"]
categories = ["development-tools::testing"]

[dependencies]
peritus-artifact-store = { version = "=0.0.0", path = "../../state/peritus-artifact-store" }
peritus-codec = { version = "=0.0.0", path = "../../foundation/peritus-codec" }
peritus-evidence = { version = "=0.0.0", path = "../../state/peritus-evidence" }
peritus-harness = { version = "=0.0.0", path = "../../orchestration/peritus-harness" }
peritus-journal = { version = "=0.0.0", path = "../../state/peritus-journal" }
peritus-model-protocol = { version = "=0.0.0", path = "../../model/peritus-model-protocol" }
peritus-scheduler = { version = "=0.0.0", path = "../../orchestration/peritus-scheduler" }
peritus-types = { version = "=0.0.0", path = "../../foundation/peritus-types" }
vstd.workspace = true

[dev-dependencies]
peritus-conformance = { version = "=0.0.0", path = "../../app/testing/peritus-conformance" }
peritus-test-support = { version = "=0.0.0", path = "../../app/testing/peritus-test-support" }
tempfile.workspace = true
tokio.workspace = true

[package.metadata.peritus]
owner = "E3"
layer = "analysis"
verification-class = "H"

[package.metadata.verus]
verify = true

[lints]
workspace = true

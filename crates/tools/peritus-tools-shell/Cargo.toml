[package]
name = "peritus-tools-shell"
description = "Authorized structured argv and explicit script tools for Peritus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = false

[features]
default = []

[dependencies]
peritus-artifact-store = { version = "=0.0.5", path = "../../state/peritus-artifact-store" }
peritus-codec = { version = "=0.0.5", path = "../../foundation/peritus-codec", optional = true }
peritus-policy = { version = "=0.0.5", path = "../../foundation/peritus-policy" }
peritus-process = { version = "=0.0.5", path = "../../runtime/peritus-process" }
peritus-sandbox = { version = "=0.0.5", path = "../../runtime/peritus-sandbox" }
peritus-tool-protocol = { version = "=0.0.5", path = "../peritus-tool-protocol" }
peritus-tool-router = { version = "=0.0.5", path = "../peritus-tool-router" }
peritus-types = { version = "=0.0.5", path = "../../foundation/peritus-types" }
serde_json.workspace = true

[lints]
workspace = true

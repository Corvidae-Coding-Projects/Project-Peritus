peritus-sandbox = { version = "=0.0.0", path = "../../runtime/peritus-sandbox" }
peritus-spec = { version = "=0.0.0", path = "../../foundation/peritus-spec" }
peritus-tool-protocol = { version = "=0.0.0", path = "../peritus-tool-protocol" }
peritus-tool-router = { version = "=0.0.0", path = "../peritus-tool-router" }
peritus-types = { version = "=0.0.0", path = "../../foundation/peritus-types" }

[package]
name = "peritus-tools-git"
description = "Authorized structured Git tools for Peritus workspaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = false
keywords = ["git", "tools", "workspace", "formal-verification"]
categories = ["development-tools"]

[dependencies]
base64.workspace = true
peritus-codec = { version = "=0.0.6", path = "../../foundation/peritus-codec" }
peritus-artifact-store = { version = "=0.0.6", path = "../../state/peritus-artifact-store" }
peritus-git = { version = "=0.0.6", path = "../../runtime/peritus-git" }
peritus-policy = { version = "=0.0.6", path = "../../foundation/peritus-policy" }
peritus-tool-protocol = { version = "=0.0.6", path = "../peritus-tool-protocol" }
peritus-tool-router = { version = "=0.0.6", path = "../peritus-tool-router" }
peritus-types = { version = "=0.0.6", path = "../../foundation/peritus-types" }
peritus-workspace = { version = "=0.0.6", path = "../../runtime/peritus-workspace" }

[lints]
workspace = true

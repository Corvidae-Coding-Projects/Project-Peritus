[package]
name = "peritus-network"
description = "Verified outbound connection planning and bounded managed proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["network", "proxy", "sandbox", "formal-verification"]
categories = ["development-tools", "network-programming"]

[dependencies]
base64.workspace = true
peritus-codec = { version = "=0.1.12", path = "../../foundation/peritus-codec" }
peritus-sandbox = { version = "=0.1.12", path = "../peritus-sandbox" }
peritus-types = { version = "=0.1.12", path = "../../foundation/peritus-types" }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "socket", "uio"] }

[package.metadata.peritus]
owner = "C3"
layer = "runtime"

[lints]
workspace = true

[package]
name = "peritus-plugin-host"
description = "Isolated process and Wasm plugin discovery, trust, lifecycle, and quota host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"

[dependencies]
peritus-plugin-sdk = { version = "=0.1.16", path = "../../foundation/peritus-plugin-sdk" }
peritus-policy = { version = "=0.1.16", path = "../../foundation/peritus-policy" }
sha2.workspace = true
process-wrap = { workspace = true, features = ["tokio1", "kill-on-drop"] }
tokio = { workspace = true, features = ["process"] }

[package.metadata.peritus]
owner = "G3"
layer = "runtime"

[lints]
workspace = true

[package]
name = "peritus-patch"
description = "Verified typed patches and recoverable filesystem transactions for Peritus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["patch", "filesystem", "transactions", "formal-verification"]
categories = ["filesystem", "data-structures"]

[dependencies]
peritus-codec = { version = "=0.0.0", path = "../../foundation/peritus-codec" }
peritus-types = { version = "=0.0.0", path = "../../foundation/peritus-types" }
vstd.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.peritus]
owner = "C1"
layer = "runtime"
verification-class = "H"

[package.metadata.verus]
verify = true

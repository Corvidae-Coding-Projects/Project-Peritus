[package]
name = "peritus-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
description = "Structured Git repository and detached-worktree operations for Project Peritus"
keywords = ["git", "worktree", "snapshots", "formal-verification"]
categories = ["development-tools", "filesystem"]

[dependencies]
peritus-codec = { path = "../../foundation/peritus-codec", version = "=0.0.7" }
peritus-types = { path = "../../foundation/peritus-types", version = "=0.0.7" }
process-wrap.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[package.metadata.peritus]
owner = "C1"
layer = "runtime"

[lints]
workspace = true

[package]
name = "peritus-process"
description = "Authorized owned process, PTY, output, cancellation, and recovery backplane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false
readme = "README.md"
keywords = ["process", "pty", "sandbox", "authorization", "formal-verification"]
categories = ["development-tools"]

[dependencies]
peritus-artifact-store = { version = "=0.1.12", path = "../../state/peritus-artifact-store" }
peritus-budget = { version = "=0.1.12", path = "../../foundation/peritus-budget" }
peritus-codec = { version = "=0.1.12", path = "../../foundation/peritus-codec" }
peritus-journal = { version = "=0.1.12", path = "../../state/peritus-journal" }
peritus-kernel = { version = "=0.1.12", path = "../../foundation/peritus-kernel" }
peritus-leases = { version = "=0.1.12", path = "../../state/peritus-leases" }
peritus-policy = { version = "=0.1.12", path = "../../foundation/peritus-policy" }
peritus-protocol = { version = "=0.1.12", path = "../../foundation/peritus-protocol" }
peritus-sandbox = { version = "=0.1.12", path = "../peritus-sandbox" }
peritus-types = { version = "=0.1.12", path = "../../foundation/peritus-types" }
portable-pty.workspace = true
process-wrap.workspace = true
sha2.workspace = true
tempfile.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[[bin]]
name = "peritus-native-helper-fixture"
path = "src/bin/peritus-native-helper-fixture.rs"

[[bin]]
name = "peritus-process-fixture"
path = "src/bin/peritus-process-fixture.rs"

[package.metadata.peritus]
owner = "C2"
layer = "runtime"

[lints]
workspace = true

[package]
name = "peritus-workspace"
description = "Target-owned workspace authorization, snapshots, rollback, and restart reconciliation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["workspace", "git", "authorization", "formal-verification"]
categories = ["filesystem", "development-tools"]

[dependencies]
cap-std.workspace = true
cap-fs-ext.workspace = true
peritus-artifact-store = { version = "=0.0.2", path = "../../state/peritus-artifact-store" }
peritus-codec = { version = "=0.0.2", path = "../../foundation/peritus-codec" }
peritus-git = { version = "=0.0.2", path = "../peritus-git" }
peritus-journal = { version = "=0.0.2", path = "../../state/peritus-journal" }
peritus-kernel = { version = "=0.0.2", path = "../../foundation/peritus-kernel" }
peritus-leases = { version = "=0.0.2", path = "../../state/peritus-leases" }
peritus-patch = { version = "=0.0.2", path = "../peritus-patch" }
peritus-policy = { version = "=0.0.2", path = "../../foundation/peritus-policy" }
peritus-protocol = { version = "=0.0.2", path = "../../foundation/peritus-protocol" }
peritus-types = { version = "=0.0.2", path = "../../foundation/peritus-types" }
sha2.workspace = true
vstd.workspace = true

[dev-dependencies]
peritus-budget = { version = "=0.0.2", path = "../../foundation/peritus-budget" }
peritus-conformance = { version = "=0.0.2", path = "../../app/testing/peritus-conformance" }
peritus-test-support = { version = "=0.0.2", path = "../../app/testing/peritus-test-support" }
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs"] }

[package.metadata.peritus]
owner = "C1"
layer = "runtime"
verification-class = "H"

[package.metadata.verus]
verify = true

[lints]
workspace = true

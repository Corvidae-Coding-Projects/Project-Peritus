name: Set up pinned Rust with bounded retries
description: Retry toolchain setup after transient download failures without hiding exhaustion.

runs:
  using: composite
  steps:
    # RUSTUP_MAX_RETRIES does not cover the channel-manifest DNS failure observed in CI.
    # Retry the entire pinned action so bootstrap, components, and environment setup agree.
    - name: Install Rust (attempt 1 of 3)
      id: first
      continue-on-error: true
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      env:
        RUSTUP_MAX_RETRIES: "10"
      with:
        toolchain: 1.97.1
        components: clippy,rustfmt
    - name: Wait before retrying Rust setup
      if: ${{ steps.first.outcome == 'failure' }}
      shell: bash
      run: sleep 10
    - name: Install Rust (attempt 2 of 3)
      id: second
      if: ${{ steps.first.outcome == 'failure' }}
      continue-on-error: true
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      env:
        RUSTUP_MAX_RETRIES: "10"
      with:
        toolchain: 1.97.1
        components: clippy,rustfmt
    - name: Wait before the final Rust setup attempt
      if: ${{ steps.second.outcome == 'failure' }}
      shell: bash
      run: sleep 20
    # Deliberately no continue-on-error: exhausted retries must still fail the job.
    # Conditions retain GitHub's implicit success() check, so cancellation stops retries.
    - name: Install Rust (attempt 3 of 3)
      if: ${{ steps.second.outcome == 'failure' }}
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      env:
        RUSTUP_MAX_RETRIES: "10"
      with:
        toolchain: 1.97.1
        components: clippy,rustfmt

name: Build Peritus release packages

on:
  workflow_dispatch:
    inputs:
      runtime_replay:
        description: Run only the real managed-browser repair replay on Ubuntu
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  RUST_VERSION: 1.97.1

jobs:
  runtime-replay:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_replay }}
    name: Managed browser runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Operate actual setup and sandboxed Chromium with disposable data
        run: python3 docs/testing/reproducers/automation-apparmor.py
      - name: Retain real browser and policy observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-replay-${{ matrix.os }}
          path: |
            dist/runtime-replay-evidence/*.stdout
            dist/runtime-replay-evidence/*.stderr
            dist/runtime-replay-evidence/*.json
            dist/runtime-replay-evidence/*.rs
          if-no-files-found: ignore

  create-draft:
    if: ${{ false }} # Repository runners remain disabled by request.
    name: Create exact draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        env:
          RUSTUP_MAX_RETRIES: "10"
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Validate tag and create retained draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --package xtask -- release-create

  build-daemon-library:
    if: ${{ false }} # Repository runners remain disabled by request.
    name: Release daemon library (${{ matrix.os }}, ${{ matrix.build }})
    strategy:
      fail-fast: false
      matrix:
        build: [primary]
        os: [macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: ${{ matrix.os == 'macos-15-intel' && '4' || '2' }}
      PERITUS_RELEASE_BUILD_ROLE: ${{ matrix.build }}
    steps:
      - name: Check out the candidate for this independent library compilation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Compile native libraries without producing the final daemon binary
        run: cargo run --locked --package xtask -- release-daemon-library
      - name: Retain this role's same-run candidate-bound libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-libraries-${{ matrix.build }}-${{ matrix.os }}-peritusd
          path: target/native-daemon-libraries
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-cli-library:
    if: ${{ false }} # Repository runners remain disabled by request.
    name: Release CLI library (macos-15-intel, ${{ matrix.build }})
    needs: build-daemon-library
    strategy:
      fail-fast: false
      matrix:
        build: [primary]
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "4"
      PERITUS_RELEASE_BUILD_ROLE: ${{ matrix.build }}
    steps:
      - name: Check out the same candidate for the CLI library compilation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Restore only this role's original same-run daemon libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-libraries-${{ matrix.build }}-macos-15-intel-peritusd
          path: target/native-daemon-libraries
      - name: Compile the CLI library with its own dependency features and no product binary
        run: cargo run --locked --package xtask -- release-cli-library
      - name: Retain the CLI libraries and original daemon compilation chain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-libraries-${{ matrix.build }}-macos-15-intel-peritus
          path: target/native-cli-libraries
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-binary:
    if: ${{ false }} # Repository runners remain disabled by request.
    name: Release binary ${{ matrix.target.binary }} (${{ matrix.target.os }}, ${{ matrix.build }})
    needs: [build-daemon-library, build-cli-library]
    strategy:
      fail-fast: false
      matrix:
        build: [primary]
        target:
          - { os: ubuntu-24.04, package: peritus-cli, binary: peritus, artifact: peritus }
          - { os: ubuntu-24.04-arm, package: peritus-cli, binary: peritus, artifact: peritus }
          - { os: ubuntu-24.04, package: peritus-daemon, binary: peritusd, artifact: peritusd }
          - { os: ubuntu-24.04-arm, package: peritus-daemon, binary: peritusd, artifact: peritusd }
          - { os: ubuntu-24.04, package: peritus-tui, binary: peritus-tui, artifact: peritus-tui }
          - { os: ubuntu-24.04-arm, package: peritus-tui, binary: peritus-tui, artifact: peritus-tui }
          - { os: ubuntu-24.04, package: peritus-sandbox-linux, binary: peritus-linux-sandbox-helper, artifact: peritus-linux-sandbox-helper }
          - { os: ubuntu-24.04-arm, package: peritus-sandbox-linux, binary: peritus-linux-sandbox-helper, artifact: peritus-linux-sandbox-helper }
          - { os: macos-15, package: peritus-cli, binary: peritus, artifact: peritus }
          - { os: macos-15-intel, package: peritus-cli, binary: peritus, artifact: peritus }
          - { os: macos-15, package: peritus-daemon, binary: peritusd, artifact: peritusd }
          - { os: macos-15-intel, package: peritus-daemon, binary: peritusd, artifact: peritusd }
          - { os: macos-15, package: peritus-tui, binary: peritus-tui, artifact: peritus-tui }
          - { os: macos-15-intel, package: peritus-tui, binary: peritus-tui, artifact: peritus-tui }
          - { os: macos-15, package: peritus-sandbox-macos, binary: peritus-macos-sandbox-helper, artifact: peritus-macos-sandbox-helper }
          - { os: macos-15-intel, package: peritus-sandbox-macos, binary: peritus-macos-sandbox-helper, artifact: peritus-macos-sandbox-helper }
          - { os: windows-2025, package: peritus-cli, binary: peritus, artifact: peritus.exe }
          - { os: windows-11-arm, package: peritus-cli, binary: peritus, artifact: peritus.exe }
          - { os: windows-2025, package: peritus-daemon, binary: peritusd, artifact: peritusd.exe }
          - { os: windows-11-arm, package: peritus-daemon, binary: peritusd, artifact: peritusd.exe }
          - { os: windows-2025, package: peritus-tui, binary: peritus-tui, artifact: peritus-tui.exe }
          - { os: windows-11-arm, package: peritus-tui, binary: peritus-tui, artifact: peritus-tui.exe }
          - { os: windows-2025, package: peritus-sandbox-windows, binary: peritus-windows-sandbox-helper, artifact: peritus-windows-sandbox-helper.exe }
          - { os: windows-11-arm, package: peritus-sandbox-windows, binary: peritus-windows-sandbox-helper, artifact: peritus-windows-sandbox-helper.exe }
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 20
    env:
      # The public Intel macOS runner has four CPUs; keep other targets at two.
      CARGO_BUILD_JOBS: ${{ matrix.target.os == 'macos-15-intel' && '4' || '2' }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        env:
          RUSTUP_MAX_RETRIES: "10"
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build one release binary
        if: ${{ runner.os != 'Windows' && (matrix.target.os != 'macos-15-intel' || (matrix.target.binary != 'peritusd' && matrix.target.binary != 'peritus')) }}
        run: >-
          cargo build --release --locked --package ${{ matrix.target.package }}
          --bin ${{ matrix.target.binary }}
      - name: Compile native Windows x86-64 with the pinned reproducible C compiler
        if: ${{ matrix.target.os == 'windows-2025' && matrix.target.binary != 'peritusd' }}
        env:
          PERITUS_RELEASE_BINARY: ${{ matrix.target.binary }}
        run: cargo run --locked --package xtask -- release-windows-binary
      - name: Link the native Windows ARM64 release binary deterministically
        if: ${{ matrix.target.os == 'windows-11-arm' }}
        run: >-
          cargo rustc --release --locked --package ${{ matrix.target.package }}
          --bin ${{ matrix.target.binary }} -- -C link-arg=/Brepro
      - name: Restore only this same-run build role's native consumer libraries
        if: ${{ (matrix.target.os == 'macos-15-intel' && (matrix.target.binary == 'peritusd' || matrix.target.binary == 'peritus')) || (matrix.target.os == 'windows-2025' && matrix.target.binary == 'peritusd') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-libraries-${{ matrix.build }}-${{ matrix.target.os }}-${{ matrix.target.binary }}
          path: target/native-${{ matrix.target.binary == 'peritus' && 'cli' || 'daemon' }}-libraries
      - name: Verify native library inputs and compile the final daemon binary
        if: ${{ (matrix.target.os == 'macos-15-intel' || matrix.target.os == 'windows-2025') && matrix.target.binary == 'peritusd' }}
        env:
          PERITUS_RELEASE_BUILD_ROLE: ${{ matrix.build }}
        run: cargo run --locked --package xtask -- release-daemon-binary
      - name: Verify native library inputs and compile the CLI with its own dependency features
        if: ${{ matrix.target.os == 'macos-15-intel' && matrix.target.binary == 'peritus' }}
        env:
          PERITUS_RELEASE_BUILD_ROLE: ${{ matrix.build }}
        run: cargo run --locked --package xtask -- release-cli-binary
      - name: Retain actual library and binary compilation observations
        if: ${{ (matrix.target.os == 'macos-15-intel' && (matrix.target.binary == 'peritusd' || matrix.target.binary == 'peritus')) || (matrix.target.os == 'windows-2025' && matrix.target.binary == 'peritusd') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-compile-${{ matrix.build }}-${{ matrix.target.os }}--${{ matrix.target.binary }}
          path: target/native-${{ matrix.target.binary }}-build.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain one release binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bin-${{ matrix.build }}-${{ matrix.target.os }}--${{ matrix.target.binary }}
          path: target/release/${{ matrix.target.artifact }}
          if-no-files-found: error
          retention-days: 30

  assemble:
    if: ${{ false }} # Repository runners remain disabled by request.
    name: Assemble package (${{ matrix.os }}, ${{ matrix.build }})
    needs: build-binary
    strategy:
      fail-fast: false
      matrix:
        build: [primary]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        env:
          RUSTUP_MAX_RETRIES: "10"
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Restore this host's release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-bin-${{ matrix.build }}-${{ matrix.os }}--*
          path: target/release
          merge-multiple: true
      - name: Assemble, archive, checksum, and record native package
        run: cargo run --locked --package xtask -- release-package-assemble
      - name: Restore the matching staged compilation records for native assembly
        if: ${{ matrix.os == 'macos-15-intel' || matrix.os == 'windows-2025' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-compile-${{ matrix.build }}-${{ matrix.os }}--*
          path: target/native-compile-record
          merge-multiple: true
      - name: Retain exact source, toolchain, platform, and assembly observations
        env:
          PERITUS_RELEASE_BUILD_ROLE: ${{ matrix.build }}
        run: cargo run --locked --package xtask -- release-rebuild-record
      - name: Retain assembled native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ matrix.build }}-${{ matrix.os }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  attest:
    if: ${{ false }} # Repository runners remain disabled by request.
    name: Attest package (${{ matrix.os }})
    needs: [create-draft, assemble]
    permissions:
      attestations: write
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        env:
          RUSTUP_MAX_RETRIES: "10"
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Restore assembled native package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package-primary-${{ matrix.os }}
          path: dist
      - name: Generate candidate-bound inventory, SBOM, and provenance
        id: evidence
        run: >-
          cargo run --locked --package peritus-release-operator --
          generate dist/peritus-native-package.json
      - name: Sign build provenance with GitHub's release identity
        id: build_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.evidence.outputs.archive }}
      - name: Sign the SPDX SBOM with GitHub's release identity
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.evidence.outputs.archive }}
          sbom-path: ${{ steps.evidence.outputs.sbom }}
      - name: Retain attestations and upload the complete native evidence set
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          cargo run --locked --package peritus-release-operator --
          retain-and-upload dist/peritus-native-package.json
          "${{ steps.build_provenance.outputs.bundle-path }}"
          "${{ steps.sbom_attestation.outputs.bundle-path }}"

  distro-image:
    if: ${{ false }} # Repository runners remain disabled by request.
    name: Distribution builder (${{ matrix.format }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64, format: deb }
          - { os: ubuntu-24.04-arm, arch: aarch64, format: deb }
          - { os: ubuntu-24.04, arch: x86_64, format: rpm }
          - { os: ubuntu-24.04-arm, arch: aarch64, format: rpm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PERITUS_PACKAGE_FORMAT: ${{ matrix.format }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build the digest-pinned distribution Docker image
        run: cargo run --locked --package xtask -- distro-image
      - name: Save the exact builder for this release run
        run: cargo run --locked --package xtask -- distro-image-save
      - name: Retain the native builder image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distro-image-${{ matrix.format }}-${{ matrix.arch }}
          path: target/distro-builder.tar
          if-no-files-found: error
          retention-days: 1

  distro-compile:
    if: ${{ false }} # Repository runners remain disabled by request.
    name: Distribution compilation (${{ matrix.format }}, ${{ matrix.arch }})
    needs: distro-image
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64, format: deb }
          - { os: ubuntu-24.04-arm, arch: aarch64, format: deb }
          - { os: ubuntu-24.04, arch: x86_64, format: rpm }
          - { os: ubuntu-24.04-arm, arch: aarch64, format: rpm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PERITUS_PACKAGE_FORMAT: ${{ matrix.format }}
      PERITUS_PACKAGE_MAINTAINER: ${{ vars.PERITUS_PACKAGE_MAINTAINER }}
      # Both standard public Linux architectures have four CPUs and 16 GiB RAM.
      PERITUS_PACKAGE_BUILD_JOBS: "4"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Restore this format and architecture's same-run builder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distro-image-${{ matrix.format }}-${{ matrix.arch }}
          path: target
      - name: Load the retained native builder
        run: cargo run --locked --package xtask -- distro-image-restore
      - name: Compile locked native sources and retain a candidate-bound build tree
        run: cargo run --locked --package xtask -- distro-compile
      - name: Retain the exact compiled tree and its observed binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distro-compiled-${{ matrix.format }}-${{ matrix.arch }}
          path: target/distro-compiled
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  distro-build:
    if: ${{ false }} # Repository runners remain disabled by request.
    name: Distribution source build (${{ matrix.format }}, ${{ matrix.arch }})
    needs: distro-compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64, format: deb, compiled: distro-compiled }
          - { os: ubuntu-24.04-arm, arch: aarch64, format: deb, compiled: distro-compiled }
          - { os: ubuntu-24.04, arch: x86_64, format: rpm, compiled: distro-compiled }
          - { os: ubuntu-24.04-arm, arch: aarch64, format: rpm, compiled: distro-compiled }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PERITUS_PACKAGE_FORMAT: ${{ matrix.format }}
      PERITUS_PACKAGE_MAINTAINER: ${{ vars.PERITUS_PACKAGE_MAINTAINER }}
      PERITUS_PACKAGE_BUILD_JOBS: "4"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Restore this format and architecture's same-run builder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distro-image-${{ matrix.format }}-${{ matrix.arch }}
          path: target
      - name: Load the retained native builder
        run: cargo run --locked --package xtask -- distro-image-restore
      - name: Restore only this same-run native compilation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.compiled }}-${{ matrix.format }}-${{ matrix.arch }}
          path: target/${{ matrix.compiled }}
      - name: Admit the compiled tree and run full native recipes and tests offline
        run: cargo run --locked --package xtask -- distro-package-compiled
      - name: Retain source, binaries, and unsigned build provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distro-unsigned-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/packages/${{ matrix.format }}
          if-no-files-found: error
          retention-days: 1

  distro-sign:
    if: ${{ false }} # Repository runners remain disabled by request.
    name: Sign and qualify distribution (${{ matrix.format }}, ${{ matrix.arch }})
    needs: [create-draft, distro-build]
    environment: release-signing
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64, format: deb }
          - { os: ubuntu-24.04-arm, arch: aarch64, format: deb }
          - { os: ubuntu-24.04, arch: x86_64, format: rpm }
          - { os: ubuntu-24.04-arm, arch: aarch64, format: rpm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PERITUS_PACKAGE_FORMAT: ${{ matrix.format }}
      PERITUS_SIGNING_FINGERPRINT: C5FAA0061C56096C0DB57E93BC1152DDCE409792
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Restore this format and architecture's same-run builder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distro-image-${{ matrix.format }}-${{ matrix.arch }}
          path: target
      - name: Load the retained native signing tools
        run: cargo run --locked --package xtask -- distro-image-restore
      - name: Restore exact same-run unsigned packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distro-unsigned-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/packages/${{ matrix.format }}
      - name: Sign packages and Debian source metadata with the reviewed release key
        env:
          PERITUS_SIGNING_KEY: ${{ secrets.PERITUS_SIGNING_KEY }}
          PERITUS_SIGNING_PASSPHRASE: ${{ secrets.PERITUS_SIGNING_PASSPHRASE }}
        run: cargo run --locked --package xtask -- distro-sign-ci
      - name: Require signatures, tamper rejection, and actual install/remove before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --package xtask -- distro-upload

  stage-draft:
    if: ${{ false }} # Repository runners remain disabled by request.
    name: Complete unpublished release draft
    needs: [attest, distro-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        env:
          RUSTUP_MAX_RETRIES: "10"
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Complete the draft after every native package succeeds; never publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --package xtask -- release-stage

  native-package:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.runtime_replay && startsWith(github.ref, 'refs/tags/v') }}
    name: Native package (${{ matrix.target.os }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 90
    permissions:
      contents: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-24.04, python: python3 }
          - { os: ubuntu-24.04-arm, python: python3 }
          - { os: macos-15, python: python3 }
          - { os: macos-15-intel, python: python3 }
          - { os: windows-2025, python: python }
          - { os: windows-11-arm, python: python }
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"
      - name: Install the pinned Windows x86-64 C compiler when needed
        if: ${{ matrix.target.os == 'windows-2025' }}
        shell: pwsh
        run: |
          $compiler = Get-Command clang-cl -ErrorAction SilentlyContinue
          if ($compiler -and ((& clang-cl --version | Select-Object -First 1) -match '^clang version 20\.1\.8(?:\s|$)')) { exit 0 }
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-20.1.8-win64.exe'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-win64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3197846a2b19063687dd56e93e34cd941e3548d907f23a6131571321bdf9fe7b') { throw 'LLVM installer checksum mismatch' }
          $installation = Join-Path $env:RUNNER_TEMP 'llvm-20.1.8'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installation") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installer exited $($process.ExitCode)" }
          (Join-Path $installation 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build native products and assemble their release archive
        run: ${{ matrix.target.python }} packaging/native_release.py
      - name: Install and run the real offline terminal through its Unix command path
        if: ${{ runner.os != 'Windows' }}
        run: ${{ matrix.target.python }} packaging/real_startup.py
      - name: Retain actual Unix installation and startup observations
        if: ${{ always() && runner.os != 'Windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-${{ matrix.target.os }}
          path: dist/startup-evidence
          if-no-files-found: ignore
      - name: Generate inventory, SBOM, and provenance
        id: evidence
        run: cargo run --locked --package peritus-release-operator -- generate dist/peritus-native-package.json
      - name: Attest the native package
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.evidence.outputs.archive }}
      - name: Attest the package SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.evidence.outputs.archive }}
          sbom-path: ${{ steps.evidence.outputs.sbom }}
      - name: Upload the package and release metadata to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          cargo run --locked --package peritus-release-operator -- retain-and-upload
          dist/peritus-native-package.json
          "${{ steps.provenance.outputs.bundle-path }}"
          "${{ steps.sbom.outputs.bundle-path }}"
      - name: Install from source with unusable compiler wrappers on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $broken = Join-Path $env:RUNNER_TEMP 'non-executable-sccache.exe'
          Set-Content -LiteralPath $broken -Value 'This file is not an executable.'
          $env:RUSTC_WRAPPER = $broken
          $env:RUSTC_WORKSPACE_WRAPPER = $broken
          $env:CARGO_BUILD_RUSTC_WRAPPER = $broken
          $env:CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER = $broken
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -Source
          if ($LASTEXITCODE -ne 0) { throw "Source installer failed: $LASTEXITCODE" }
          if ($env:RUSTC_WRAPPER -ne $broken) { throw 'Installer changed the parent environment.' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Peritus/bin/peritus.exe'
          $expected = 'peritus ' + $env:GITHUB_REF_NAME.TrimStart('v')
          $actual = & $installed --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw "Installed version differs: $actual" }

  native-stage:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.runtime_replay && startsWith(github.ref, 'refs/tags/v') }}
    name: Stage native release installers
    needs: native-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Require all native assets and upload version-bound installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --package xtask -- release-native-stage

name: Publish Peritus release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_BUILD_JOBS: "1"
  RUST_VERSION: 1.97.1

jobs:
  create-draft:
    name: Create exact draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Validate tag and create retained draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --package xtask -- release-create

  package:
    name: Package (${{ matrix.os }})
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Enforce repository policy
        run: cargo run --locked --package xtask -- all
      - name: Qualify native package and public installer lifecycle
        run: cargo run --locked --package xtask -- release-bootstrap-smoke
      - name: Build, archive, checksum, and upload native package
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --package xtask -- release-package-upload

  publish:
    name: Publish complete release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Publish only after every native package succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --package xtask -- release-publish

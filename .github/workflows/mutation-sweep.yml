name: Complete Rust mutation sweep

# One-time branch trigger for the explicitly requested whole-workspace sweep.
on:
  push:
    branches: [mutation-sweep-20261102]

permissions:
  contents: read

env:
  SHARD_TOTAL: "1020"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      shards_0: ${{ steps.matrix.outputs.shards_0 }}
      shards_1: ${{ steps.matrix.outputs.shards_1 }}
      shards_2: ${{ steps.matrix.outputs.shards_2 }}
      shards_3: ${{ steps.matrix.outputs.shards_3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
      - name: Verify discovery controller semantics
        run: python3 -m unittest discover -s discovery -p 'test_*.py'
      - name: Build pinned mutation tool
        run: |
          cargo install --locked cargo-mutants --version 27.1.0
          mkdir -p "$RUNNER_TEMP/preflight/bin"
          cp "$(command -v cargo-mutants)" "$RUNNER_TEMP/preflight/bin/cargo-mutants"
          cargo mutants --version > "$RUNNER_TEMP/preflight/tool-version.txt"
      - name: Inventory the exact production mutation set
        run: >-
          python3 discovery/mutation/run.py inventory
          --output "$RUNNER_TEMP/preflight/inventory"
      - name: Build four nonempty 255-shard matrices
        id: matrix
        run: |
          python3 - <<'PY'
          import json
          import os

          total = int(os.environ["SHARD_TOTAL"])
          batch_size = 255
          batches = [list(range(start, start + batch_size)) for start in range(0, total, batch_size)]
          assert len(batches) == 4
          assert [value for batch in batches for value in batch] == list(range(total))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for index, batch in enumerate(batches):
                  output.write(f"shards_{index}={json.dumps(batch, separators=(',', ':'))}\n")
          PY
      - name: Retain the canonical inventory and pinned tool
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  mutate_0:
    needs: prepare
    uses: ./.github/workflows/mutation-shard.yml
    with:
      shards: ${{ needs.prepare.outputs.shards_0 }}
      shard_total: 1020

  mutate_1:
    needs: prepare
    uses: ./.github/workflows/mutation-shard.yml
    with:
      shards: ${{ needs.prepare.outputs.shards_1 }}
      shard_total: 1020

  mutate_2:
    needs: prepare
    uses: ./.github/workflows/mutation-shard.yml
    with:
      shards: ${{ needs.prepare.outputs.shards_2 }}
      shard_total: 1020

  mutate_3:
    needs: prepare
    uses: ./.github/workflows/mutation-shard.yml
    with:
      shards: ${{ needs.prepare.outputs.shards_3 }}
      shard_total: 1020

  aggregate:
    if: ${{ always() }}
    needs: [prepare, mutate_0, mutate_1, mutate_2, mutate_3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the canonical inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight
      - name: Download every shard receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*-of-${{ env.SHARD_TOTAL }}-${{ github.run_id }}
          path: ${{ runner.temp }}/shards
      - name: Prove complete, disjoint candidate accounting
        run: >-
          python3 discovery/mutation/aggregate.py
          --preflight "$RUNNER_TEMP/preflight"
          --shards "$RUNNER_TEMP/shards"
          --expected-shards "$SHARD_TOTAL"
          --output "$RUNNER_TEMP/mutation-sweep-summary.json"
      - name: Retain the whole-sweep verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-sweep-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/mutation-sweep-summary.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

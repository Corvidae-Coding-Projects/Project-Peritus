[package]
name = "peritus-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.149"
peritus-codec = { path = "../../crates/foundation/peritus-codec" }
peritus-types = { path = "../../crates/foundation/peritus-types" }
peritus-policy = { path = "../../crates/foundation/peritus-policy" }
peritus-provider-core = { path = "../../crates/model/peritus-provider-core" }
peritus-model-protocol = { path = "../../crates/model/peritus-model-protocol" }
peritus-tool-protocol = { path = "../../crates/tools/peritus-tool-protocol" }
peritus-patch = { path = "../../crates/runtime/peritus-patch" }
peritus-context = { path = "../../crates/orchestration/peritus-context" }
peritus-role = { path = "../../crates/orchestration/peritus-role" }
peritus-eval = { path = "../../crates/analysis/peritus-eval" }

[profile.release]
debug = 1
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "codec_frame"
path = "fuzz_targets/codec_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_primitives"
path = "fuzz_targets/codec_primitives.rs"
test = false
doc = false
bench = false

